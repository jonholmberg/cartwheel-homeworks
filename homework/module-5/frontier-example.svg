<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360">
  <style>
    text { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; fill: #1a1a1a; }
    .axis { stroke: #333; stroke-width: 1.5; fill: none; }
    .grid { stroke: #e0e0e0; stroke-width: 0.5; }
    .frontier { stroke: #6ea8fe; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .dot-frontier { fill: #2563eb; }
    .dot-dominated { fill: #dc2626; }
    .label { font-size: 13px; font-weight: bold; }
    .axis-title { font-size: 13px; }
    .desc { font-size: 11px; fill: #444; }
  </style>

  <!-- gridlines -->
  <line class="grid" x1="80" y1="60"  x2="480" y2="60"/>
  <line class="grid" x1="80" y1="120" x2="480" y2="120"/>
  <line class="grid" x1="80" y1="180" x2="480" y2="180"/>
  <line class="grid" x1="80" y1="240" x2="480" y2="240"/>

  <!-- axes -->
  <line class="axis" x1="80" y1="290" x2="490" y2="290"/>
  <line class="axis" x1="80" y1="290" x2="80"  y2="40"/>
  <polygon points="490,290 484,286 484,294" fill="#333"/>
  <polygon points="80,40 76,46 84,46"       fill="#333"/>

  <!-- axis titles -->
  <text class="axis-title" x="285" y="330" text-anchor="middle">Cost per 100 conversations (USD)</text>
  <text class="axis-title" x="24" y="165" text-anchor="middle"
        transform="rotate(-90 24 165)">Mean case score</text>

  <!-- frontier line: 4 to 2 to 1 -->
  <polyline class="frontier" points="150,115 300,85 430,50"/>

  <!-- improvement arrow from 3 up to 4 -->
  <line x1="150" y1="218" x2="150" y2="125" stroke="#999"
        stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="150,125 146,133 154,133" fill="#999"/>
  <text x="160" y="175" font-size="11" fill="#666" font-style="italic"
        font-family="-apple-system, system-ui, sans-serif">agent change</text>

  <!-- Config 1: gpt-5.5, starting agent (top right, label above) -->
  <circle class="dot-frontier" cx="430" cy="50" r="7"/>
  <text class="label" x="430" y="35" text-anchor="middle">1</text>
  <text class="desc" x="430" y="25" text-anchor="middle">gpt-5.5, starting agent</text>

  <!-- Config 2: claude-opus-4-6, starting agent (middle, label below) -->
  <circle class="dot-frontier" cx="300" cy="85" r="7"/>
  <text class="label" x="300" y="110" text-anchor="middle">2</text>
  <text class="desc" x="300" y="123" text-anchor="middle">claude-opus-4-6, starting agent</text>

  <!-- Config 3: GLM 5.2, starting agent (dominated, bottom left) -->
  <circle class="dot-dominated" cx="150" cy="225" r="7"/>
  <text class="label" x="165" y="230">3</text>
  <text class="desc" x="165" y="248">GLM 5.2, starting agent</text>
  <text x="165" y="263" font-size="11" fill="#dc2626"
        font-family="-apple-system, system-ui, sans-serif">(dominated)</text>

  <!-- Config 4: GLM 5.2, final agent (frontier, left, label above) -->
  <circle class="dot-frontier" cx="150" cy="115" r="7"/>
  <text class="label" x="165" y="108">4</text>
  <text class="desc" x="165" y="96">GLM 5.2, final agent</text>

  <!-- frontier label (top right, away from points) -->
  <text x="420" y="80" font-size="11" fill="#666" font-style="italic"
        font-family="-apple-system, system-ui, sans-serif">frontier</text>
</svg>
